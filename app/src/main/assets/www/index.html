<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entregas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B0F0D;--card:#161C19;--bd:#232B27;--tx:#F2F5F3;--mu:#8A968F;--g:#16A34A;--g2:#22C55E}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Roboto,sans-serif}
#app{padding:18px 16px 96px;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:28px}
header b{font-size:20px;display:block}header span{color:var(--mu);font-size:13px}
.cta{width:100%;border:0;border-radius:18px;padding:22px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font:700 21px system-ui;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.card small{color:var(--mu);font-size:12px;display:block}.card b{font-size:22px}
h2{font-size:17px;margin:20px 0 10px}
.empty{color:var(--mu);text-align:center;padding:22px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#121715;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:12px system-ui;padding:10px 0;min-height:60px}
nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--g2);font-weight:700}
#t{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:10px 16px;border-radius:20px;display:none;font-size:14px}
</style></head><body>
<div id="app">
<header><div class="logo">🍕</div><div><b>Pizzaria</b><span>Controle de entregas</span></div></header>
<button class="cta" onclick="soon()"><span>Registrar Entrega</span><span>›</span></button>
<div class="grid">
<div class="card"><small>Entregas hoje</small><b id="n">0</b></div>
<div class="card"><small>Total das taxas</small><b id="t$">R$ 0,00</b></div>
<div class="card"><small>Entregadores</small><b id="c">0</b></div>
<div class="card"><small>Expediente</small><b id="d" style="font-size:18px"></b></div>
</div>
<h2>Resumo por entregador</h2>
<div class="card" id="list"></div>
</div>
<nav>
<button class="on"><i>🏠</i>Início</button>
<button onclick="soon()"><i>🧾</i>Histórico</button>
<button onclick="soon()"><i>📋</i>Fechamento</button>
<button onclick="soon()"><i>☰</i>Mais</button>
</nav>
<div id="t"></div>
<script>
function soon(){var t=document.getElementById('t');t.textContent='Disponível na próxima etapa';t.style.display='block';setTimeout(function(){t.style.display='none'},1500)}
var S;try{S=JSON.parse(localStorage.getItem('pizza_v2'))}catch(e){}
S=S&&S.deliveries?S:{couriers:[],shifts:[],deliveries:[]};
var brl=function(c){return (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var sh=S.shifts.filter(function(s){return !s.close})[0];
var ds=sh?S.deliveries.filter(function(d){return d.sid==sh.id}):[];
var tot=ds.reduce(function(a,d){return a+d.fee},0);
document.getElementById('n').textContent=ds.length;
document.getElementById('t$').textContent=brl(tot);
document.getElementById('c').textContent=S.couriers.filter(function(c){return c.active}).length;
document.getElementById('d').textContent=new Date(sh?sh.open:Date.now()).toLocaleDateString('pt-BR');
document.getElementById('list').innerHTML='<div class="empty">Nenhuma entrega registrada ainda.</div>';
</script></body></html>
