<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Pizza</title>
<style>
:root{--bg:#000;--card:#0F0F0F;--el:#1A1A1A;--tx:#fff;--mu:#AAA;--pr:#FF6B00;--bd:#222;--sel:#1f1005;--ok:#22C55E;--grad:linear-gradient(135deg,#FF6B00,#FF8C3A);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Roboto,sans-serif;padding-bottom:84px}
#app{max-width:520px;margin:0 auto;padding:16px}
#app.in{animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd b{font-size:20px;letter-spacing:2px;display:block}.hd span{color:var(--mu);font-size:12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:26px;box-shadow:0 0 22px #FF6B0066}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.st b{display:block;font-size:19px}.st span{color:var(--mu);font-size:12px}
button{font:inherit;border-radius:14px;padding:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer;min-height:48px;transition:transform .1s,border-color .15s,box-shadow .15s}
button:active{transform:scale(.97)}
button.p{background:var(--grad);border-color:transparent;font-weight:700;color:#fff}
button.big{min-height:76px;font-size:20px;width:100%;letter-spacing:.5px}
button.cta{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px #FF6B0066}}
button.ok{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;min-height:60px;font-size:18px;width:100%;box-shadow:0 6px 22px #FF6B0044}
button.sel{border:1.5px solid var(--pr);background:var(--sel);box-shadow:0 0 14px #FF6B0044;font-weight:700}
button.c{min-height:68px;font-size:16px;display:flex;align-items:center;gap:10px;text-align:left}button.c small{display:block;color:var(--mu);font-weight:400}
button.sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
.av{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:10px}
input,select{font:inherit;width:100%;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--el);color:var(--tx);min-height:48px}
input:focus,select:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px #FF6B0033}
input.fee{font-size:32px;font-weight:700;text-align:center;padding-left:56px}
.feewrap{position:relative}.feewrap:before{content:'R$';position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--pr);font-weight:700;font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.tot{font-weight:700;color:var(--pr)}.off{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0A0A0A;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;min-height:60px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pr);font-weight:700}nav button.on svg{filter:drop-shadow(0 0 6px #FF6B00aa)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--el);border:1px solid var(--pr);color:#fff;padding:12px 18px;border-radius:24px;display:none;z-index:9;font-weight:600}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal>div{background:var(--card);border:1px solid var(--bd);padding:18px;border-radius:18px;max-width:360px;width:100%}
#okv{position:fixed;inset:0;background:#000b;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;font-weight:700;font-size:20px}
#okv.on{display:flex}
#okv svg{width:96px;height:96px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 14px #22C55E88)}
#okv circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .45s ease-out forwards}
#okv path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .3s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#sp{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#sp.out{opacity:0}
#sp .orb{width:96px;height:96px;border-radius:28px;background:var(--grad);display:grid;place-items:center;font-size:52px;box-shadow:0 0 50px #FF6B0088;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 70px #FF6B00aa}}
#sp b{letter-spacing:5px;font-size:22px}
#sp i{width:140px;height:3px;background:#222;border-radius:2px;overflow:hidden;position:relative}
#sp i:after{content:'';position:absolute;inset:0;background:var(--grad);transform-origin:left;animation:fill 1.1s ease-in-out forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero{background:var(--grad);border-radius:16px;padding:16px;margin:10px 0 4px;color:#fff;box-shadow:0 6px 24px #FF6B0044}.hero small{display:block;font-size:13px;opacity:.9}.hero b{display:block;font-size:34px;line-height:1.2}.hero span{font-size:13px}
h3{font-size:14px;color:var(--mu);margin:18px 0 4px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tag{font-size:12px;background:var(--el);border:1px solid var(--bd);border-radius:20px;padding:2px 8px;color:var(--mu)}
.pay{border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:4px}.rt{text-align:right}.amt{font-size:22px}.paybtn{width:100%}
.pay.paid .amt{color:var(--ok)}.pay.paid button.sel{border-color:var(--ok);background:#0d2418;box-shadow:none;color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#okv circle,#okv path{stroke-dashoffset:0!important}}
@media print{nav,.noprint,#toast{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<nav><button data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Início</button><button data-v="hist" onclick="go('hist')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button><button data-v="close" onclick="go('close')"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13h7M9 17h5"/></svg>Fechamento</button><button data-v="team" onclick="go('team')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c2 .6 3.3 2.4 3.5 5"/></svg>Equipe</button></nav>
<div id="toast"></div><div id="okv"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg>Entrega registrada!</div><div id="sp"><div class="orb">🍕</div><b>NOSSA PIZZA</b><i></i></div>
<div id="modal"><div><p id="mq"></p><div class="grid g2"><button onclick="mc(0)">Cancelar</button><button class="p" onclick="mc(1)">Confirmar</button></div></div></div>
<script>
const K='pizza_entregas_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S&&S.deliveries?S:{couriers:[],shifts:[],deliveries:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Erro ao salvar!')}};
const $=i=>document.getElementById(i),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const hm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cents=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:Math.round(n*100)};
const cur=()=>S.shifts.find(s=>!s.close);
const cou=id=>S.couriers.find(c=>c.id==id)||{name:'(removido)',ini:'?'};
const PL={ifood:'iFood',anota:'Anota AI'};
let V='home',P=null,F={order:'',fee:'',cid:null,plat:'ifood',edit:null},H={c:'',p:'',a:'',b:''},busy=false,mfn=null;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1400)}
function ask(q,fn){$('mq').textContent=q;mfn=fn;$('modal').style.display='flex'}
function mc(y){$('modal').style.display='none';if(y&&mfn)mfn()}
function go(v,p){V=v;P=p||null;render();scrollTo(0,0);const a=$('app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}
function stats(ds){const by={};let n=0,t=0,i=0,a=0,ni=0,na=0;ds.forEach(d=>{const b=by[d.cid]=by[d.cid]||{n:0,t:0,i:0,a:0,ci:0,ca:0};b.n++;b.t+=d.fee;n++;t+=d.fee;if(d.plat=='ifood'){b.i+=d.fee;b.ci++;i+=d.fee;ni++}else{b.a+=d.fee;b.ca++;a+=d.fee;na++}});return{by,n,t,i,a,ni,na}}
const sd=sid=>S.deliveries.filter(d=>d.sid==sid);
const pl=(n,s,p)=>n+' '+(n==1?s:p);
function reportHTML(sid){const sh=S.shifts.find(x=>x.id==sid),s=stats(sd(sid)),pd=sh.paid||{},ids=Object.keys(s.by);let paid=0;ids.forEach(id=>{if(pd[id])paid+=s.by[id].t});
const tag=(l,c,v)=>c?'<span class="tag">'+l+' · '+c+' · '+brl(v)+'</span>':'';
return '<div class="hero"><small>A pagar aos entregadores</small><b>'+brl(s.t)+'</b><span>'+pl(s.n,'entrega','entregas')+(s.t?' · pago '+brl(paid)+' de '+brl(s.t):'')+'</span></div><h3>Quanto cada entregador recebe</h3>'+
(ids.length?ids.map(id=>{const b=s.by[id],c=cou(id),ok=pd[id];return '<div class="pay '+(ok?'paid':'')+'"><div class="row" style="border:0;padding-bottom:6px"><div class="who">'+av(id)+'<div><b>'+esc(c.name)+'</b> <span class="mu">('+esc(c.ini)+')</span><div class="tags">'+tag('iFood',b.ci,b.i)+tag('Anota AI',b.ca,b.a)+'</div></div></div><div class="rt"><b class="amt">'+brl(b.t)+'</b><div class="mu">'+pl(b.n,'entrega','entregas')+'</div></div></div><button class="sm paybtn noprint '+(ok?'sel':'')+'" onclick="togPay(\''+sid+'\',\''+id+'\')">'+(ok?'✓ Pago':'Marcar como pago')+'</button></div>'}).join(''):'<p class="mu">Nenhuma entrega neste expediente.</p>')+
'<h3>De onde vieram as taxas</h3><div class="row"><span>iFood <span class="mu">· '+pl(s.ni,'entrega','entregas')+'</span></span><b>'+brl(s.i)+'</b></div><div class="row"><span>Anota AI <span class="mu">· '+pl(s.na,'entrega','entregas')+'</span></span><b>'+brl(s.a)+'</b></div><p class="mu" style="margin:6px 0 0">iFood + Anota AI = '+brl(s.t)+'</p>'}
function togPay(sid,cid){const sh=S.shifts.find(x=>x.id==sid);sh.paid=sh.paid||{};sh.paid[cid]=!sh.paid[cid];save();render()}
function reportText(sid){const sh=S.shifts.find(x=>x.id==sid),s=stats(sd(sid)),pd=sh.paid||{};
let t='FECHAMENTO — Nossa Pizza\n'+dt(sh.open)+(sh.close?' a '+hm(sh.close):' (em aberto)')+'\n\nA PAGAR AOS ENTREGADORES: '+brl(s.t)+'\n'+pl(s.n,'entrega','entregas')+'\n\nQUANTO CADA UM RECEBE\n';
Object.keys(s.by).forEach(id=>{const b=s.by[id],c=cou(id);t+='\n'+c.name.toUpperCase()+' ('+c.ini+') — '+brl(b.t)+(pd[id]?' ✓ PAGO':'')+'\n'+pl(b.n,'entrega','entregas')+(b.ci?'\n  iFood: '+b.ci+' · '+brl(b.i):'')+(b.ca?'\n  Anota AI: '+b.ca+' · '+brl(b.a):'')+'\n'});
return t+'\nDE ONDE VIERAM AS TAXAS\niFood: '+pl(s.ni,'entrega','entregas')+' · '+brl(s.i)+'\nAnota AI: '+pl(s.na,'entrega','entregas')+' · '+brl(s.a)+'\nTotal: '+brl(s.t)}
async function share(sid){const t=reportText(sid);if(window.Android){Android.share(t);return}try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name=='AbortError')return}
try{await navigator.clipboard.writeText(t);toast('Copiado!')}catch(e){prompt('Copie o texto:',t)}}
function openShift(){S.shifts.push({id:uid(),open:Date.now(),close:null});save();render();toast('Expediente aberto')}
function closeShift(){const s=cur();ask('Encerrar o expediente? Os dados serão preservados e novas entregas iniciarão um novo expediente.',()=>{s.close=Date.now();save();go('rep',s.id)})}
function pick(id){F.cid=id;render()}function nextAnota(){const s=cur();if(!s)return '';const n=S.deliveries.filter(d=>d.sid==s.id&&d.plat=='anota'&&/^\d+$/.test(d.order)).map(d=>+d.order);return n.length?String(Math.max.apply(null,n)+1):'1'}
function plat(p){F.plat=p;if(!F.edit&&(!F.order||F.auto)){F.order=p=='anota'?nextAnota():'';F.auto=true}render()}
function newDel(){F={order:F.plat=='anota'?nextAnota():'',auto:true,fee:'',cid:null,plat:F.plat,edit:null};go('reg')}
function saveDel(){if(busy)return;if(cents(F.fee)<=0)return toast('Informe a taxa');if(!F.cid)return toast('Escolha o entregador');
if(!F.order.trim()){toast('Informe o número do pedido');const q=$('ord');q&&q.focus();return}
if(F.plat=='ifood'&&F.order.trim().length!=4){toast('Pedido iFood tem 4 números');const q=$('ord');q&&q.focus();return}
const o=F.order.trim(),sid=F.edit?S.deliveries.find(x=>x.id==F.edit).sid:(cur()||{}).id;
if(o&&S.deliveries.some(d=>d.sid==sid&&d.plat==F.plat&&d.order==o&&d.id!=F.edit))return ask('O pedido '+o+' ('+PL[F.plat]+') já foi registrado neste expediente. Registrar mesmo assim?',commitDel);
commitDel()}
function commitDel(){if(busy)return;const fee=cents(F.fee);
if(fee<=0)return toast('Informe a taxa');if(!F.cid)return toast('Escolha o entregador');
busy=true;setTimeout(()=>busy=false,600);
if(F.edit){const d=S.deliveries.find(x=>x.id==F.edit);Object.assign(d,{order:F.order.trim(),fee,cid:F.cid,plat:F.plat});save();toast('Registro corrigido');F.edit=null;go('hist');return}
const s=cur();if(!s)return toast('Abra um expediente');
S.deliveries.push({id:uid(),sid:s.id,order:F.order.trim(),fee,cid:F.cid,plat:F.plat,ts:Date.now()});save();
F.order=F.plat=='anota'?nextAnota():'';F.auto=true;F.fee='';F.cid=null;render();okAnim();setTimeout(()=>{const f=$('fee');f&&f.focus()},50)}
function editDel(id){const d=S.deliveries.find(x=>x.id==id);F={order:d.order,fee:(d.fee/100).toFixed(2).replace('.',','),cid:d.cid,plat:d.plat,edit:id};go('reg')}
function delDel(id){ask('Excluir esta entrega?',()=>{S.deliveries=S.deliveries.filter(x=>x.id!=id);save();render();toast('Excluída')})}
function addCou(){const n=$('cn').value.trim(),i=$('ci').value.trim().toUpperCase();if(!n||!i)return toast('Informe nome e iniciais');
if(P){const c=S.couriers.find(x=>x.id==P);c.name=n;c.ini=i;P=null}else S.couriers.push({id:uid(),name:n,ini:i,active:true});save();render()}
function togCou(id){const c=S.couriers.find(x=>x.id==id);c.active=!c.active;save();render()}
function editCou(id){P=id;render();const c=cou(id);$('cn').value=c.name;$('ci').value=c.ini}
const views={
home(){const s=cur(),ds=s?sd(s.id):[],st=stats(ds),ac=S.couriers.filter(c=>c.active).length;
if(!s)return `<div class="hd"><div class="logo">🍕</div><div><b>Nossa Pizza</b><span>Controle de entregas</span></div></div><div class="card"><p>Nenhum expediente aberto.</p><button class="p big" onclick="openShift()">ABRIR EXPEDIENTE</button></div>${S.couriers.length?'':'<p class="mu">Comece cadastrando os entregadores na aba Equipe.</p>'}`;
return `<div class="hd"><div class="logo">🍕</div><div><b>Nossa Pizza</b><span>Controle de entregas</span></div></div><div class="mu" style="margin:-4px 0 12px">Expediente de ${new Date(s.open).toLocaleDateString('pt-BR')} · aberto às ${hm(s.open)}</div>
<button class="p big cta" onclick="${ac?'newDel()':"go('team')"}">${ac?'REGISTRAR ENTREGA':'CADASTRAR ENTREGADORES'}</button>
<div class="grid g3 card st" style="margin-top:12px"><div><b>${st.n}</b><span>entregas</span></div><div><b>${brl(st.t)}</b><span>em taxas</span></div><div><b>${ac}</b><span>entregadores</span></div></div>
<div class="card"><b>Por entregador</b>${Object.keys(st.by).length?Object.keys(st.by).map(id=>`<div class="row"><span class="who">${av(id)}<span>${esc(cou(id).name)}<div class="mu">${st.by[id].n} entrega${st.by[id].n==1?'':'s'}</div></span></span><b>${brl(st.by[id].t)}</b></div>`).join(''):'<p class="mu">Sem entregas ainda.</p>'}</div>
<div class="grid g2"><button onclick="go('hist')">Histórico</button><button onclick="go('close')">Fechamento</button></div>`},
reg(){const s=cur();if(!s&&!F.edit)return views.home();
const list=S.couriers.filter(c=>c.active||c.id==F.cid);
return `<button class="sm" onclick="var h=F.edit;F.edit=null;go(h?'hist':'home')">← Voltar</button><h1 style="margin-top:10px">${F.edit?'Corrigir entrega':'Registrar entrega'}</h1>
<label>Taxa de entrega (R$)</label><div class="feewrap"><input id="fee" class="fee" inputmode="numeric" placeholder="0,00" value="${esc(F.fee)}" oninput="maskFee(this)"></div>
<label>Plataforma</label><div class="grid g2"><button class="${F.plat=='ifood'?'sel':''}" onclick="plat('ifood')">iFood</button><button class="${F.plat=='anota'?'sel':''}" onclick="plat('anota')">Anota AI</button></div>
<label>Entregador</label><div class="grid g2">${list.map(c=>`<button class="c ${F.cid==c.id?'sel':''}" onclick="pick('${c.id}')">${av(c.id)}<span>${esc(c.name)}<small>${esc(c.ini)}</small></span></button>`).join('')||'<p class="mu">Cadastre entregadores na aba Equipe.</p>'}</div>
<label>${F.plat=='anota'?'Nº do pedido Anota AI (sequência, já sugerido)':'Nº do pedido iFood (4 números)'}</label><input id="ord" inputmode="numeric" maxlength="${F.plat=='anota'?5:4}" value="${esc(F.order)}" oninput="F.order=this.value=this.value.replace(/\D/g,'');F.auto=false">
<p class="mu">${F.edit?'Data e hora originais mantidas.':'Data e hora: automáticas ao salvar.'}</p>
<button class="ok" onclick="saveDel()">${F.edit?'SALVAR CORREÇÃO':'CONFIRMAR'}</button>`},
hist(){let ds=S.deliveries.slice().sort((a,b)=>b.ts-a.ts);
if(H.c)ds=ds.filter(d=>d.cid==H.c);if(H.p)ds=ds.filter(d=>d.plat==H.p);
if(H.a)ds=ds.filter(d=>d.ts>=new Date(H.a+'T00:00:00').getTime());if(H.b)ds=ds.filter(d=>d.ts<=new Date(H.b+'T23:59:59').getTime());
const st=stats(ds);
return `<h1>Histórico</h1><div class="card noprint"><div class="grid g2"><select onchange="H.c=this.value;render()"><option value="">Todos entregadores</option>${S.couriers.map(c=>`<option value="${c.id}" ${H.c==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
<select onchange="H.p=this.value;render()"><option value="">Todas plataformas</option><option value="ifood" ${H.p=='ifood'?'selected':''}>iFood</option><option value="anota" ${H.p=='anota'?'selected':''}>Anota AI</option></select>
<input type="date" value="${H.a}" onchange="H.a=this.value;render()"><input type="date" value="${H.b}" onchange="H.b=this.value;render()"></div></div>
<p class="tot">${st.n} entregas · ${brl(st.t)}</p><div class="card">${ds.map(d=>`<div class="row"><div class="who">${av(d.cid)}<div><b>${brl(d.fee)}</b> · ${PL[d.plat]}${d.order?' · #'+esc(d.order):''}<div class="mu">${esc(cou(d.cid).name)} (${esc(cou(d.cid).ini)}) · ${dt(d.ts)}</div></div></div><div class="noprint" style="display:flex;gap:6px"><button class="sm" onclick="editDel('${d.id}')">✎</button><button class="sm" onclick="delDel('${d.id}')">🗑</button></div></div>`).join('')||'<p class="mu">Nenhuma entrega encontrada.</p>'}</div>`},
close(){const s=cur(),past=S.shifts.filter(x=>x.close).sort((a,b)=>b.close-a.close);
return `<h1>Fechamento</h1>${s?`<div class="card"><b>Expediente atual</b> <span class="mu">desde ${dt(s.open)}</span>${reportHTML(s.id)}<button class="noprint" style="width:100%;margin-top:10px" onclick="share('${s.id}')">Compartilhar / Imprimir</button><button class="p big noprint" style="min-height:56px;margin-top:10px;font-size:17px" onclick="closeShift()">ENCERRAR EXPEDIENTE</button></div>`:`<div class="card"><p>Nenhum expediente aberto.</p><button class="p big" onclick="openShift()">ABRIR EXPEDIENTE</button></div>`}
<h2>Fechamentos anteriores</h2><div class="card">${past.map(x=>`<div class="row" onclick="go('rep','${x.id}')" style="cursor:pointer"><span>${dt(x.open)} → ${hm(x.close)}</span><span class="tot">${brl(stats(sd(x.id)).t)} ›</span></div>`).join('')||'<p class="mu">Nenhum ainda.</p>'}</div>`},
rep(){const x=S.shifts.find(s=>s.id==P);return `<button class="sm noprint" onclick="go('close')">← Voltar</button><h1 style="margin-top:10px">Fechamento</h1><div class="card"><b>${dt(x.open)}</b> <span class="mu">${x.close?'até '+hm(x.close):'em aberto'}</span>${reportHTML(x.id)}<button class="noprint" style="width:100%;margin-top:10px" onclick="share('${x.id}')">Compartilhar / Imprimir</button></div>`},
team(){const e=P?cou(P):null;return `<h1>Entregadores</h1><div class="card"><label>Nome ou identificação</label><input id="cn" placeholder="Ex.: João"><label>Iniciais (as da nota)</label><input id="ci" maxlength="4" placeholder="Ex.: JS"><div class="grid g2" style="margin-top:12px">${P?'<button onclick="P=null;render()">Cancelar</button>':'<span></span>'}<button class="p" onclick="addCou()">${P?'Salvar':'Adicionar'}</button></div></div>
<div class="card">${S.couriers.map(c=>`<div class="row ${c.active?'':'off'}"><span class="who">${av(c.id)}<span><b>${esc(c.name)}</b><div class="mu">${esc(c.ini)}${c.active?'':' · inativo'}</div></span></span><span style="display:flex;gap:6px"><button class="sm" onclick="editCou('${c.id}')">Editar</button><button class="sm" onclick="togCou('${c.id}')">${c.active?'Desativar':'Ativar'}</button></span></div>`).join('')||'<p class="mu">Nenhum entregador cadastrado.</p>'}</div><p class="mu">Entregadores desativados continuam aparecendo nos históricos e fechamentos.</p>`}};
const TAB={home:'home',reg:'home',hist:'hist',close:'close',rep:'close',team:'team'};
function render(){$('app').innerHTML=views[V]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==TAB[V]))}
const PAL=['#FF6B00','#3B82F6','#A855F7','#22C55E','#EAB308','#EC4899','#14B8A6','#EF4444'];
function av(id){const i=S.couriers.findIndex(c=>c.id==id),c=cou(id);return '<span class="av" style="background:'+(i<0?'#555':PAL[i%PAL.length])+'">'+esc((c.ini||'?').charAt(0))+'</span>'}
function maskFee(el){let d=el.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,7);if(!d){el.value='';F.fee='';return}d=d.padStart(3,'0');el.value=d.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+d.slice(-2);F.fee=el.value.replace(/\./g,'')}
function okAnim(){const o=$('okv');o.classList.remove('on');void o.offsetWidth;o.classList.add('on');if(navigator.vibrate)navigator.vibrate(30);setTimeout(()=>o.classList.remove('on'),950)}
setTimeout(()=>{const s=$('sp');s.classList.add('out');setTimeout(()=>s.remove(),400)},1100);
render();
</script>
</body>
</html>
